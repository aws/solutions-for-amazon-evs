name: Python lint

on:
  pull_request:
    paths:
      - '**/*.py'
  push:
    paths:
      - '**/*.py'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: |
          ruff check Deploy/EVS-Deployment-Orchestrator/orchestrator Deploy/EVS-Deployment-Orchestrator/spec-generator Deploy/EVS-Deployment-Orchestrator/check-quotas.py Deploy/EVS-Deployment-Orchestrator/destroy.py \
            --select E,F,W \
            --ignore E501
