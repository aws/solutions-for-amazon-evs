name: Python lint

on:
  pull_request:
    paths:
      - '**/*.py'
  push:
    paths:
      - '**/*.py'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: |
          ruff check Phase_2_evs_env/python/src Phase_3_VCF9/python/src \
            --select E,F,W \
            --ignore E501
