name: Validate config.example.json

on:
  pull_request:
    paths:
      - 'Phase_2_evs_env/python/config.example.json'
  push:
    paths:
      - 'Phase_2_evs_env/python/config.example.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate config.example.json
        run: |
          python - <<'EOF'
          import json
          import sys

          CONFIG_PATH = "Phase_2_evs_env/python/config.example.json"

          # Required top-level keys (excluding _comment_ keys)
          REQUIRED_KEYS = [
              "environmentName",
              "vpcId",
              "serviceAccessSubnetId",
              "evsEnvVersion",
              "termsAccepted",
              "initialVlans",
              "region",
              "esxVersion",
              "additionalHosts",
              "targetVcfVersion",
              "vcfInstallerProductVersion",
              "vcfSizing",
          ]

          # Required VLAN keys
          REQUIRED_VLANS = [
              "vmkManagement",
              "vMotion",
              "vSan",
              "vTep",
              "edgeVTep",
              "vmManagement",
              "hcx",
              "nsxUplink",
              "expansionVlan1",
              "expansionVlan2",
          ]

          errors = []

          # 1. Valid JSON
          try:
              with open(CONFIG_PATH) as f:
                  config = json.load(f)
          except json.JSONDecodeError as e:
              print(f"FAIL: {CONFIG_PATH} is not valid JSON: {e}")
              sys.exit(1)

          # 2. Required keys present
          for key in REQUIRED_KEYS:
              if key not in config:
                  errors.append(f"Missing required key: '{key}'")

          # 3. esxVersion must not be empty/null
          esx = config.get("esxVersion")
          if not esx or not str(esx).startswith("ESXi-"):
              errors.append(
                  f"'esxVersion' must be a valid ESXi build string starting with 'ESXi-', got: {esx!r}"
              )

          # 4. initialVlans must have all required VLAN keys
          vlans = config.get("initialVlans", {})
          for vlan_key in REQUIRED_VLANS:
              if vlan_key not in vlans:
                  errors.append(f"Missing required VLAN: 'initialVlans.{vlan_key}'")
              elif "cidr" not in vlans.get(vlan_key, {}):
                  errors.append(f"'initialVlans.{vlan_key}' must have a 'cidr' field")

          # 5. additionalHosts must have at least 3 hosts with required fields
          hosts = config.get("additionalHosts", [])
          if len(hosts) < 3:
              errors.append(f"'additionalHosts' must have at least 3 hosts, got {len(hosts)}")
          for i, host in enumerate(hosts):
              for field in ("hostName", "keyName", "instanceType"):
                  if field not in host:
                      errors.append(f"'additionalHosts[{i}]' missing required field '{field}'")

          # 6. targetVcfVersion must start with 9.
          tv = config.get("targetVcfVersion", "")
          if not str(tv).startswith("9."):
              errors.append(f"'targetVcfVersion' must start with '9.', got: {tv!r}")

          # Report
          if errors:
              print(f"FAIL: {len(errors)} validation error(s) in {CONFIG_PATH}:\n")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)
          else:
              print(f"PASS: {CONFIG_PATH} is valid ({len(REQUIRED_KEYS)} keys, {len(REQUIRED_VLANS)} VLANs, {len(hosts)} hosts)")
          EOF
